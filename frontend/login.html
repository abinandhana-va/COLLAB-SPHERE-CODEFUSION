<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CollabSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --dark-purple: #2D1B4B;
            --medium-purple: #6A3CBF;
            --light-purple: #9D71EA;
            --accent-purple: #B288F8;
            --very-light-purple: #EDE4FF;
            --black: #121212;
            --dark-gray: #1E1E1E;
            --medium-gray: #2A2A2A;
            --light-gray: #333333;
        }
        
        body {
            background-color: var(--black);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Navbar styling */
        .navbar {
            background: linear-gradient(135deg, var(--dark-purple) 0%, var(--medium-purple) 100%);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            padding: 15px 0;
        }
        
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 1.5rem;
        }
        
        .nav-link {
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 10px 15px !important;
            margin: 0 5px;
            border-radius: 6px;
        }
        
        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--accent-purple) !important;
            transform: translateY(-2px);
        }
        
        .nav-link.active {
            background-color: rgba(255, 255, 255, 0.15);
            color: white !important;
            font-weight: 600;
        }
        
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
            position: relative;
        }
        
        main::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 50%, var(--medium-purple) 0%, transparent 60%);
            opacity: 0.07;
            z-index: 0;
        }
        
        .login-container {
            background: linear-gradient(145deg, var(--medium-gray), var(--dark-gray));
            border-radius: 16px;
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1;
        }
        
        .login-header {
            background: linear-gradient(135deg, var(--medium-purple) 0%, var(--dark-purple) 100%);
            padding: 25px 30px;
            position: relative;
        }
        
        .login-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--light-purple), var(--accent-purple), var(--light-purple));
        }
        
        .login-title {
            margin: 0;
            font-weight: 700;
            font-size: 28px;
            letter-spacing: 0.5px;
        }
        
        .login-subtitle {
            opacity: 0.9;
            margin-top: 5px;
            font-size: 16px;
        }
        
        .login-body {
            padding: 30px;
        }
        
        .form-label {
            color: var(--very-light-purple);
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .form-control {
            background-color: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 8px;
            padding: 12px 15px;
            height: auto;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(178, 136, 248, 0.25);
            color: white;
        }
        
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .form-floating > .form-control {
            padding-top: 20px;
            padding-bottom: 5px;
            height: 60px;
        }
        
        .form-floating > label {
            padding: 20px 15px 5px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            color: var(--accent-purple);
            opacity: 1;
            transform: scale(0.85) translateY(-0.7rem) translateX(0.15rem);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--medium-purple) 0%, var(--dark-purple) 100%);
            border: none;
            border-radius: 8px;
            padding: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(106, 60, 191, 0.3);
        }
        
        .btn-primary:hover, .btn-primary:focus {
            transform: translateY(-3px);
            box-shadow: 0 7px 25px rgba(106, 60, 191, 0.4);
            background: linear-gradient(135deg, var(--medium-purple) 30%, var(--dark-purple) 100%);
        }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            margin: 20px 0;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .divider::before {
            margin-right: 15px;
        }
        
        .divider::after {
            margin-left: 15px;
        }
        
        .social-login {
            display: flex;
            gap: 10px;
        }
        
        .social-login-btn {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 8px;
            padding: 12px 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .social-login-btn i {
            margin-right: 8px;
            font-size: 1.2rem;
        }
        
        .social-login-btn:hover {
            background-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }
        
        .login-footer {
            text-align: center;
            margin-top: 25px;
        }
        
        .login-footer p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 5px;
        }
        
        .login-footer a {
            color: var(--accent-purple);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .login-footer a:hover {
            text-decoration: underline;
        }
        
        .form-check-input {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .form-check-input:checked {
            background-color: var(--medium-purple);
            border-color: var(--medium-purple);
        }
        
        .forgot-password {
            color: var(--accent-purple);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .forgot-password:hover {
            text-decoration: underline;
            color: var(--light-purple);
        }
        
        .login-error {
            background-color: rgba(255, 77, 109, 0.1);
            border-left: 4px solid #ff4d6d;
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        footer {
            background-color: var(--dark-gray);
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            padding: 20px 0;
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* Animation for login container */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-container {
            animation: fadeIn 0.6s ease forwards;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">CollabSphere</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="bi bi-house-door me-1"></i>Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/login.html"><i class="bi bi-box-arrow-in-right me-1"></i>Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/signup.html"><i class="bi bi-person-plus me-1"></i>Sign Up</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <div class="login-container">
            <div class="login-header">
                <h1 class="login-title">Welcome Back</h1>
                <p class="login-subtitle">Login to your CollabSphere account</p>
            </div>
            
            <div class="login-body">
                <div class="login-error" id="login-error">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span id="error-message">Invalid email or password. Please try again.</span>
                </div>
                
                <form id="login-form">
                    <div class="mb-4">
                        <div class="form-floating">
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            <label for="email"><i class="bi bi-envelope me-2"></i>Email address</label>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <div class="form-floating">
                            <input type="password" class="form-control" id="password" placeholder="Password" required>
                            <label for="password"><i class="bi bi-lock me-2"></i>Password</label>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember-me">
                            <label class="form-check-label" for="remember-me">
                                Remember me
                            </label>
                        </div>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100" id="login-button">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Login
                    </button>
                </form>
                
                <div class="divider">or continue with</div>
                
                <div class="social-login">
                    <button type="button" class="social-login-btn">
                        <i class="bi bi-google"></i>Google
                    </button>
                    <button type="button" class="social-login-btn">
                        <i class="bi bi-github"></i>GitHub
                    </button>
                </div>
                
                <div class="login-footer">
                    <p>Don't have an account? <a href="/signup.html">Sign up</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 CollabSphere. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('login-form');
            const loginButton = document.getElementById('login-button');
            const loginError = document.getElementById('login-error');
            const errorMessage = document.getElementById('error-message');
            
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // Show loading state
                loginButton.disabled = true;
                loginButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Logging in...';
                
                // Hide previous error
                loginError.style.display = 'none';
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        // Store auth data
                        localStorage.setItem('userId', data.userId);
                        localStorage.setItem('userRole', data.role);
                        localStorage.setItem('token', data.token);
                        
                        // Show success alert
                        Swal.fire({
                            icon: 'success',
                            title: 'Login Successful!',
                            text: 'Redirecting to your dashboard...',
                            timer: 1500,
                            showConfirmButton: false,
                            background: '#2A2A2A',
                            color: 'white',
                            iconColor: '#B288F8'
                        });
                        
                        // Redirect based on role
                        setTimeout(() => {
                            window.location.href = data.role === 'creator' ? '/dashboard.html' : '/dashboard.html';
                        }, 1500);
                    } else {
                        // Show error
                        errorMessage.textContent = data.message || 'Invalid email or password. Please try again.';
                        loginError.style.display = 'block';
                        
                        // Reset button
                        loginButton.disabled = false;
                        loginButton.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Login';
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    
                    // Show error
                    errorMessage.textContent = 'An error occurred during login. Please try again.';
                    loginError.style.display = 'block';
                    
                    // Reset button
                    loginButton.disabled = false;
                    loginButton.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Login';
                }
            });
        });
    </script>
</body>
</html>
