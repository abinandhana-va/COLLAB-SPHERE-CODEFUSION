<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contributor Profile | CollabSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .form-title {
            margin-bottom: 30px;
            text-align: center;
        }
        .btn-submit {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">CollabSphere</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/profile.html">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/projects.html">Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/discussions.html">Discussions</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container form-container">
        <h2 class="form-title">Contributor Profile</h2>
        <p class="text-center mb-4">Complete your profile to find exciting collaboration opportunities</p>
        
        <form id="contributor-profile-form">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="profession" class="form-label">Profession</label>
                    <input type="text" class="form-control" id="profession" placeholder="e.g. Web Developer, Designer">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="specialization" class="form-label">Specialization</label>
                    <input type="text" class="form-control" id="specialization" placeholder="e.g. React, UX Design">
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="experience" class="form-label">Years of Experience</label>
                    <input type="number" class="form-control" id="experience" min="0" max="50">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="location" class="form-label">Location</label>
                    <input type="text" class="form-control" id="location">
                </div>
            </div>
            
            <div class="mb-3">
                <label for="bio" class="form-label">Bio/About</label>
                <textarea class="form-control" id="bio" rows="3"></textarea>
            </div>
            
            <div class="mb-3">
                <label for="skills" class="form-label">Skills (comma separated)</label>
                <input type="text" class="form-control" id="skills" placeholder="e.g. JavaScript, Python, Photoshop">
            </div>
            
            <div class="mb-3">
                <label for="languages" class="form-label">Languages (comma separated)</label>
                <input type="text" class="form-control" id="languages" placeholder="e.g. English, Spanish, French">
            </div>
            
            <div class="mb-3">
                <label for="availability" class="form-label">Availability</label>
                <select class="form-select" id="availability">
                    <option value="">Select Availability</option>
                    <option value="Full-time">Full-time</option>
                    <option value="Part-time">Part-time</option>
                    <option value="Weekends only">Weekends only</option>
                    <option value="Evenings only">Evenings only</option>
                    <option value="Flexible">Flexible</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label for="portfolioLinks" class="form-label">Portfolio Links (one per line)</label>
                <textarea class="form-control" id="portfolioLinks" rows="3" placeholder="e.g. https://myportfolio.com"></textarea>
            </div>
            
            <h4 class="mt-4 mb-3">Social Links</h4>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="linkedin" class="form-label">LinkedIn URL</label>
                    <input type="url" class="form-control" id="linkedin">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="twitter" class="form-label">Twitter URL</label>
                    <input type="url" class="form-control" id="twitter">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="website" class="form-label">Website URL</label>
                    <input type="url" class="form-control" id="website">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="github" class="form-label">GitHub URL</label>
                    <input type="url" class="form-control" id="github">
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-submit">Save Profile</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Get user ID and role from localStorage (in a real app, this would be from auth)
        const userId = localStorage.getItem('userId');
        const userRole = 'contributor'; // Since this is the contributor profile page
        
        // Check if user is already logged in, redirect if not
        if (!userId) {
            window.location.href = '/login.html';
        }
        
        // Check if profile exists and fill form
        async function loadProfile() {
            try {
                const response = await fetch(`http://localhost:5000/api/profile/me?userId=${userId}`);
                if (response.ok) {
                    const profile = await response.json();
                    
                    // Fill form with existing data
                    document.getElementById('name').value = profile.name || '';
                    document.getElementById('email').value = profile.email || '';
                    document.getElementById('profession').value = profile.profession || '';
                    document.getElementById('specialization').value = profile.specialization || '';
                    document.getElementById('experience').value = profile.experience || '';
                    document.getElementById('location').value = profile.location || '';
                    document.getElementById('bio').value = profile.bio || '';
                    document.getElementById('skills').value = profile.skills ? profile.skills.join(', ') : '';
                    document.getElementById('languages').value = profile.languages ? profile.languages.join(', ') : '';
                    document.getElementById('availability').value = profile.availability || '';
                    document.getElementById('portfolioLinks').value = profile.portfolioLinks ? profile.portfolioLinks.join('\n') : '';
                    
                    // Social links
                    if (profile.social) {
                        document.getElementById('linkedin').value = profile.social.linkedin || '';
                        document.getElementById('twitter').value = profile.social.twitter || '';
                        document.getElementById('website').value = profile.social.website || '';
                        document.getElementById('github').value = profile.social.github || '';
                    }
                }
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }
        
        // Handle form submission
        document.getElementById('contributor-profile-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            // Gather form data
            const profileData = {
                userId: userId,
                role: userRole,
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                profession: document.getElementById('profession').value,
                specialization: document.getElementById('specialization').value,
                experience: parseInt(document.getElementById('experience').value) || 0,
                location: document.getElementById('location').value,
                bio: document.getElementById('bio').value,
                skills: document.getElementById('skills').value.split(',').map(item => item.trim()).filter(item => item),
                languages: document.getElementById('languages').value.split(',').map(item => item.trim()).filter(item => item),
                availability: document.getElementById('availability').value,
                portfolioLinks: document.getElementById('portfolioLinks').value.split('\n').map(item => item.trim()).filter(item => item),
                social: {
                    linkedin: document.getElementById('linkedin').value,
                    twitter: document.getElementById('twitter').value,
                    website: document.getElementById('website').value,
                    github: document.getElementById('github').value
                }
            };
            
            try {
                // Send data to backend
                const response = await fetch('http://localhost:5000/api/profile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(profileData)
                });
                
                if (!response.ok) {
                    throw new Error('Failed to save profile');
                }
                
                const result = await response.json();
                alert('Profile saved successfully!');
                
                // Redirect to profile view page
                window.location.href = '/profile.html';
            } catch (error) {
                console.error('Error saving profile:', error);
                alert('Error saving profile. Please try again.');
            }
        });
        
        // Load profile on page load
        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
