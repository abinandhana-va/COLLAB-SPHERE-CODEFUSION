<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | CollabSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --dark-purple: #2D1B4B;
            --medium-purple: #6A3CBF;
            --light-purple: #9D71EA;
            --accent-purple: #B288F8;
            --very-light-purple: #EDE4FF;
            --black: #121212;
            --dark-gray: #1E1E1E;
            --medium-gray: #2A2A2A;
            --light-gray: #333333;
        }
        
        body {
            background-color: var(--black);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* Navbar styling */
        .navbar {
            background: linear-gradient(135deg, var(--dark-purple) 0%, var(--medium-purple) 100%);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            padding: 15px 0;
        }
        
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 1.5rem;
        }
        
        .nav-link {
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 10px 15px !important;
            margin: 0 5px;
            border-radius: 6px;
        }
        
        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--accent-purple) !important;
            transform: translateY(-2px);
        }
        
        .profile-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0;
        }
        
        .profile-header {
            background: linear-gradient(135deg, var(--dark-purple) 0%, var(--medium-purple) 100%);
            border-radius: 12px 12px 0 0;
            padding: 25px; /* Reduced height by reducing padding */
            position: relative;
            overflow: hidden;
        }
        
        .profile-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 80%;
            height: 200%;
            background: linear-gradient(transparent, rgba(255, 255, 255, 0.1));
            transform: rotate(35deg);
        }
        
        .profile-name {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
            position: relative;
            z-index: 1;
        }
        
        .profile-location {
            text-align: center;
            opacity: 0.8;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            position: relative;
            z-index: 1;
        }
        
        .profile-badge {
            background: var(--dark-purple);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-block;
            margin-top: 10px;
            border: 1px solid var(--accent-purple);
            position: relative;
            z-index: 1;
        }
        
        .profile-content {
            background: var(--dark-gray);
            border-radius: 0 0 12px 12px;
            padding: 40px;
        }
        
        .profile-section {
            margin-bottom: 30px;
            background: var(--medium-gray);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        
        .profile-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }
        
        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--accent-purple);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title i {
            font-size: 1.4rem;
        }
        
        .section-content {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }
        
        .skill-badge {
            background: linear-gradient(135deg, var(--medium-purple) 0%, var(--dark-purple) 100%);
            padding: 8px 15px;
            border-radius: 20px;
            margin-right: 10px;
            margin-bottom: 10px;
            display: inline-block;
            font-weight: 500;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .skill-badge:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .social-links {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        
        .social-link {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--medium-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .social-link:hover {
            background: var(--accent-purple);
            transform: translateY(-3px);
            color: white;
        }
        
        .btn-edit-profile {
            background: linear-gradient(135deg, var(--medium-purple) 0%, var(--dark-purple) 100%);
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(106, 60, 191, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-edit-profile:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 25px rgba(106, 60, 191, 0.4);
            background: linear-gradient(135deg, var(--medium-purple) 30%, var(--dark-purple) 100%);
        }
        
        /* Modal styling */
        .modal-content {
            background-color: var(--dark-gray);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .modal-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: linear-gradient(135deg, var(--dark-purple) 0%, var(--medium-purple) 100%);
        }
        
        .modal-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .btn-close {
            background-color: rgba(255, 255, 255, 0.5);
        }
        
        .form-control {
            background-color: var(--medium-gray);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .form-control:focus {
            background-color: var(--medium-gray);
            border-color: var(--accent-purple);
            color: white;
            box-shadow: 0 0 0 0.25rem rgba(106, 60, 191, 0.25);
        }
        
        .form-label {
            color: rgba(255, 255, 255, 0.8);
        }
        
        .btn-secondary {
            background-color: var(--medium-gray);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .btn-secondary:hover {
            background-color: var(--light-gray);
        }
        
        /* Loading animation */
        .loading {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent-purple);
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        .empty-state {
            text-align: center;
            padding: 20px;
            opacity: 0.7;
            font-style: italic;
        }
        
        /* Toast notification */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1050;
        }
        
        .custom-toast {
            background-color: var(--dark-gray);
            color: white;
            border: 1px solid var(--accent-purple);
            border-radius: 8px;
            padding: 15px 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .toast-success {
            border-left: 5px solid #28a745;
        }
        
        .toast-error {
            border-left: 5px solid #dc3545;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">CollabSphere</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard.html"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/profile.html"><i class="bi bi-person me-1"></i> Profile</a>
                    </li>

                        <a class="nav-link" href="/discussions.html"><i class="bi bi-chat-dots me-1"></i> Discussions</a>

        </div>
    </nav>

    <div class="container profile-container">
        <div class="profile-header">
            <h2 class="profile-name" id="profile-name">Loading...</h2>
            <p class="profile-location" id="profile-location">
                <i class="bi bi-geo-alt"></i> Loading...
            </p>
            <div class="text-center">
                <span class="profile-badge" id="profile-role">Loading...</span>
            </div>
        </div>
        
        <div class="profile-content">
            <div class="row">
                <div class="col-md-12">
                    <div class="profile-section">
                        <h3 class="section-title"><i class="bi bi-person-badge"></i> Bio</h3>
                        <div class="section-content" id="profile-bio">
                            <div class="d-flex justify-content-center py-3">
                                <div class="loading"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="profile-section">
                        <h3 class="section-title"><i class="bi bi-lightning-charge"></i> Skills</h3>
                        <div class="section-content" id="profile-skills">
                            <div class="d-flex justify-content-center py-3">
                                <div class="loading"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="profile-section">
                        <h3 class="section-title"><i class="bi bi-mortarboard"></i> Education</h3>
                        <div class="section-content" id="profile-education">
                            <div class="d-flex justify-content-center py-3">
                                <div class="loading"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="profile-section">
                        <h3 class="section-title"><i class="bi bi-envelope"></i> Contact</h3>
                        <div class="section-content" id="profile-contact">
                            <div class="d-flex justify-content-center py-3">
                                <div class="loading"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="profile-section">
                        <h3 class="section-title"><i class="bi bi-globe"></i> Social</h3>
                        <div class="section-content">
                            <div id="profile-social">
                                <div class="d-flex justify-content-center py-3">
                                    <div class="loading"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="row mt-4">
                <div class="col-12 d-flex justify-content-end">
                    <button id="edit-profile-btn" class="btn btn-edit-profile">
                        <i class="bi bi-pencil-square"></i> Edit Profile
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast container for notifications -->
    <div class="toast-container"></div>

    <!-- Edit Profile Modal -->
    <div class="modal fade" id="editProfileModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Edit Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="profile-form">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="location" class="form-label">Location</label>
                            <input type="text" class="form-control" id="location">
                        </div>
                        <div class="mb-3">
                            <label for="bio" class="form-label">Bio</label>
                            <textarea class="form-control" id="bio" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="skills" class="form-label">Skills (comma separated)</label>
                            <input type="text" class="form-control" id="skills">
                        </div>
                        <div class="mb-3">
                            <label for="education" class="form-label">Education</label>
                            <input type="text" class="form-control" id="education">
                        </div>
                        <div class="mb-3">
                            <label for="contactInfo" class="form-label">Contact Information</label>
                            <input type="text" class="form-control" id="contactInfo">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Social Links</label>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-twitter"></i></span>
                                        <input type="text" class="form-control" id="twitter" placeholder="Twitter URL">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-linkedin"></i></span>
                                        <input type="text" class="form-control" id="linkedin" placeholder="LinkedIn URL">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-github"></i></span>
                                        <input type="text" class="form-control" id="github" placeholder="GitHub URL">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-globe"></i></span>
                                        <input type="text" class="form-control" id="website" placeholder="Website URL">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="save-profile-btn">
                        <i class="bi bi-check-lg me-2"></i>Save Changes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Get user data from localStorage
        const userId = localStorage.getItem('userId');
        const username = localStorage.getItem('username');
        const userRole = localStorage.getItem('userRole');
        
        // Redirect if not logged in
        if (!userId) {
            window.location.href = '/login.html';
        }
        
        // Display username from localStorage initially
        if (username) {
            document.getElementById('profile-name').textContent = username;
            document.getElementById('profile-role').textContent = userRole === 'creator' ? 'Project Creator' : 'Contributor';
        }
        
        // Get profile modal
        const editProfileModal = new bootstrap.Modal(document.getElementById('editProfileModal'));
        
        // Track current profile data
        let currentProfile = null;
        
        // Get profile data
        async function getProfile() {
            try {
                const response = await fetch(`http://localhost:5000/api/profile/user/${userId}`);
                if (!response.ok) {
                    throw new Error('Profile not found');
                }
                const profile = await response.json();
                currentProfile = profile; // Store the current profile data
                displayProfile(profile);
                return profile;
            } catch (error) {
                console.error('Error fetching profile:', error);
                createEmptyProfile();
                return null;
            }
        }
        
        // Display profile data
        function displayProfile(profile) {
            // Use name from profile or username from localStorage
            document.getElementById('profile-name').textContent = profile.name || username || 'No Name';
            document.getElementById('profile-location').innerHTML = profile.location ? 
                `<i class="bi bi-geo-alt"></i> ${profile.location}` : 
                '<i class="bi bi-geo-alt"></i> No Location';
            
            document.getElementById('profile-role').textContent = userRole === 'creator' ? 'Project Creator' : 'Contributor';
            
            // Bio section
            document.getElementById('profile-bio').textContent = profile.bio || 'No bio available';
            
            // Skills section
            const skillsContainer = document.getElementById('profile-skills');
            skillsContainer.innerHTML = '';
            if (profile.skills && profile.skills.length > 0) {
                profile.skills.forEach(skill => {
                    if (skill) {
                        const badge = document.createElement('span');
                        badge.className = 'skill-badge';
                        badge.textContent = skill;
                        skillsContainer.appendChild(badge);
                    }
                });
            } else {
                skillsContainer.innerHTML = '<div class="empty-state">No skills listed</div>';
            }
            
            // Education section
            document.getElementById('profile-education').textContent = profile.education || 'No education information';
            
            // Contact section
            document.getElementById('profile-contact').textContent = profile.contactInfo || 'No contact information';
            
            // Social links
            const socialContainer = document.getElementById('profile-social');
            socialContainer.innerHTML = '';
            
            if (profile.social && (profile.social.twitter || profile.social.linkedin || profile.social.github || profile.social.website)) {
                const socialLinksDiv = document.createElement('div');
                socialLinksDiv.className = 'social-links';
                
                if (profile.social.twitter) 
                    socialLinksDiv.innerHTML += `<a href="${profile.social.twitter}" target="_blank" class="social-link"><i class="bi bi-twitter"></i></a>`;
                
                if (profile.social.linkedin) 
                    socialLinksDiv.innerHTML += `<a href="${profile.social.linkedin}" target="_blank" class="social-link"><i class="bi bi-linkedin"></i></a>`;
                
                if (profile.social.github) 
                    socialLinksDiv.innerHTML += `<a href="${profile.social.github}" target="_blank" class="social-link"><i class="bi bi-github"></i></a>`;
                
                if (profile.social.website) 
                    socialLinksDiv.innerHTML += `<a href="${profile.social.website}" target="_blank" class="social-link"><i class="bi bi-globe"></i></a>`;
                
                socialContainer.appendChild(socialLinksDiv);
            } else {
                socialContainer.innerHTML = '<div class="empty-state">No social links available</div>';
            }
        }
        
        // Create empty profile display
        function createEmptyProfile() {
            document.getElementById('profile-name').textContent = username || 'New User';
            document.getElementById('profile-location').innerHTML = '<i class="bi bi-geo-alt"></i> No Location';
            document.getElementById('profile-role').textContent = userRole === 'creator' ? 'Project Creator' : 'Contributor';
            document.getElementById('profile-bio').innerHTML = '<div class="empty-state">You have not created a profile yet. Click the Edit Profile button to get started.</div>';
            document.getElementById('profile-skills').innerHTML = '<div class="empty-state">No skills listed</div>';
            document.getElementById('profile-education').innerHTML = '<div class="empty-state">No education information</div>';
            document.getElementById('profile-contact').innerHTML = '<div class="empty-state">No contact information</div>';
            document.getElementById('profile-social').innerHTML = '<div class="empty-state">No social links available</div>';
            
            document.getElementById('edit-profile-btn').innerHTML = '<i class="bi bi-plus-lg me-2"></i>Create Profile';
        }
        
        // Fill edit form with current profile data
        function fillEditForm(profile) {
            document.getElementById('name').value = profile.name || username || '';
            document.getElementById('location').value = profile.location || '';
            document.getElementById('bio').value = profile.bio || '';
            document.getElementById('skills').value = profile.skills ? profile.skills.join(', ') : '';
            document.getElementById('education').value = profile.education || '';
            document.getElementById('contactInfo').value = profile.contactInfo || '';
            
            // Social links
            if (profile.social) {
                document.getElementById('twitter').value = profile.social.twitter || '';
                document.getElementById('linkedin').value = profile.social.linkedin || '';
                document.getElementById('github').value = profile.social.github || '';
                document.getElementById('website').value = profile.social.website || '';
            } else {
                document.getElementById('twitter').value = '';
                document.getElementById('linkedin').value = '';
                document.getElementById('github').value = '';
                document.getElementById('website').value = '';
            }
        }
        
        // Save profile changes
        async function saveProfile() {
            try {
                const name = document.getElementById('name').value || username;
                const location = document.getElementById('location').value;
                const bio = document.getElementById('bio').value;
                const skills = document.getElementById('skills').value.split(',').map(skill => skill.trim()).filter(skill => skill);
                const education = document.getElementById('education').value;
                const contactInfo = document.getElementById('contactInfo').value;
                
                const social = {
                    twitter: document.getElementById('twitter').value,
                    linkedin: document.getElementById('linkedin').value,
                    github: document.getElementById('github').value,
                    website: document.getElementById('website').value
                };
                
                const profileData = {
                    userId,
                    name,
                    location,
                    bio,
                    skills,
                    education,
                    contactInfo,
                    social
                };
                
                const response = await fetch('http://localhost:5000/api/profile', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(profileData)
                });
                
                if (!response.ok) {
                    throw new Error('Error saving profile');
                }
                
                // Get the updated profile and update UI
                const updatedProfile = await response.json();
                currentProfile = updatedProfile; // Update the current profile data
                
                // Directly update the UI with the form values instead of relying on server response
                displayProfile(profileData);
                
                editProfileModal.hide();
                
                // Show success toast
                showToast('Profile updated successfully!');
            } catch (error) {
                console.error('Error saving profile:', error);
                showToast('Error saving profile. Please try again.', 'error');
            }
        }
        
        // Show toast notification
        function showToast(message, type = 'success') {
            const toastContainer = document.querySelector('.toast-container');
            
            // Create toast element
            const toast = document.createElement('div');
            toast.className = `custom-toast ${type === 'error' ? 'toast-error' : 'toast-success'}`;
            toast.innerHTML = `
                <i class="bi ${type === 'error' ? 'bi-exclamation-circle' : 'bi-check-circle'} me-2"></i>
                <span>${message}</span>
            `;
            
            // Add to container
            toastContainer.appendChild(toast);
            
            // Remove after 3 seconds
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => {
                    toastContainer.removeChild(toast);
                }, 500);
            }, 3000);
        }
        
        // Handle logout
        document.getElementById('logout-btn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('userId');
            localStorage.removeItem('userRole');
            localStorage.removeItem('username');
            window.location.href = '/login.html';
        });
        
        // Event listeners
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Get initial profile
                const profile = await getProfile();
                
                // Set up edit button
                document.getElementById('edit-profile-btn').addEventListener('click', () => {
                    fillEditForm(currentProfile || {});
                    editProfileModal.show();
                });
                
                // Save profile button
                document.getElementById('save-profile-btn').addEventListener('click', saveProfile);
            } catch (error) {
                console.error('Error initializing profile page:', error);
                createEmptyProfile();
            }
        });
    </script>
</body>
</html>
