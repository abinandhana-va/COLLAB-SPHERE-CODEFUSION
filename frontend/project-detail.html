<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details | CollabSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --dark-purple: #2D1B4B;
            --medium-purple: #6A3CBF;
            --light-purple: #9D71EA;
            --accent-purple: #B288F8;
            --very-light-purple: #EDE4FF;
            --black: #121212;
            --dark-gray: #1E1E1E;
            --medium-gray: #2A2A2A;
            --light-gray: #333333;
        }
        
        body {
            background-color: var(--black);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .navbar {
            background: linear-gradient(135deg, var(--dark-purple) 0%, var(--medium-purple) 100%);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            padding: 15px 0;
        }
        
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 1.5rem;
        }
        
        .nav-link {
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 10px 15px !important;
            margin: 0 5px;
            border-radius: 6px;
        }
        
        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--accent-purple) !important;
            transform: translateY(-2px);
        }
        
        .project-header {
            background: linear-gradient(135deg, var(--dark-purple) 0%, var(--medium-purple) 100%);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }
        
        .project-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 80%;
            height: 200%;
            background: linear-gradient(transparent, rgba(255, 255, 255, 0.1));
            transform: rotate(35deg);
            z-index: 0;
        }
        
        .project-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }
        
        .project-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            position: relative;
            z-index: 1;
        }
        
        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .meta-item:hover {
            background: rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }
        
        .project-status {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 50px;
            font-weight: 500;
            font-size: 0.9rem;
            position: relative;
            z-index: 1;
        }
        
        .status-open {
            background-color: rgba(25, 135, 84, 0.2);
            color: #198754;
            border: 1px solid #198754;
        }
        
        .status-in-progress {
            background-color: rgba(13, 110, 253, 0.2);
            color: #0d6efd;
            border: 1px solid #0d6efd;
        }
        
        .status-completed {
            background-color: rgba(102, 16, 242, 0.2);
            color: #6610f2;
            border: 1px solid #6610f2;
        }
        
        .status-cancelled {
            background-color: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border: 1px solid #dc3545;
        }
        
        .project-creator {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            position: relative;
            z-index: 1;
        }
        
        .creator-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-purple);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            border: 2px solid white;
        }
        
        .creator-info span {
            display: block;
        }
        
        .creator-name {
            font-weight: 600;
        }
        
        .creator-role {
            font-size: 0.85rem;
            opacity: 0.8;
        }
        
        .project-section {
            background: var(--dark-gray);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .project-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--accent-purple);
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }
        
        .section-content {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }
        
        .tag {
            display: inline-block;
            background: var(--medium-gray);
            padding: 8px 15px;
            border-radius: 50px;
            margin-right: 10px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .tag:hover {
            border-color: var(--accent-purple);
            background: rgba(106, 60, 191, 0.2);
            transform: translateY(-2px);
        }
        
        .btn-custom-primary {
            background: linear-gradient(135deg, var(--medium-purple) 0%, var(--dark-purple) 100%);
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(106, 60, 191, 0.3);
        }
        
        .btn-custom-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 25px rgba(106, 60, 191, 0.4);
            background: linear-gradient(135deg, var(--medium-purple) 30%, var(--dark-purple) 100%);
        }
        
        .btn-outline-light {
            border-color: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        
        .btn-outline-light:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: white;
            transform: translateY(-2px);
        }
        
        .modal-content {
            background-color: var(--dark-gray);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .modal-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: linear-gradient(135deg, var(--dark-purple) 0%, var(--medium-purple) 100%);
        }
        
        .modal-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .form-control, .form-select {
            background-color: var(--medium-gray);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        
        .form-control:focus, .form-select:focus {
            background-color: var(--medium-gray);
            border-color: var(--accent-purple);
            color: white;
            box-shadow: 0 0 0 0.25rem rgba(106, 60, 191, 0.25);
            transform: translateY(-2px);
        }
        
        .form-label {
            color: rgba(255, 255, 255, 0.8);
        }
        
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
        }
        
        .loading {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent-purple);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1050;
        }
        
        .custom-toast {
            background-color: var(--dark-gray);
            color: white;
            border: 1px solid var(--accent-purple);
            border-radius: 8px;
            padding: 15px 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease forwards;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .toast-success {
            border-left: 5px solid #28a745;
        }
        
        .toast-error {
            border-left: 5px solid #dc3545;
        }
        
        .animated-icon {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }
        
        .nav-tabs {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .nav-tabs .nav-link {
            border: none;
            border-bottom: 3px solid transparent;
            border-radius: 0;
            color: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .nav-tabs .nav-link:hover {
            color: white;
            background-color: transparent;
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .nav-tabs .nav-link.active {
            color: var(--accent-purple);
            background-color: transparent;
            border-color: var(--accent-purple);
        }
        
        .discussion-container {
            padding: 20px;
            background: var(--dark-gray);
            border-radius: 12px;
            margin-top: 20px;
        }
        
        .post-card {
            background: var(--medium-gray);
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        
        .post-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .post-content {
            padding: 20px;
        }
        
        .post-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }
        
        .replies-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .reply-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .reply-item:last-child {
            border-bottom: none;
        }
        
        .no-data-icon {
            font-size: 3rem;
            opacity: 0.3;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">CollabSphere</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard.html"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/profile.html"><i class="bi bi-person me-1"></i> Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/projects.html"><i class="bi bi-kanban me-1"></i> Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/discussions.html"><i class="bi bi-chat-dots me-1"></i> Discussions</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logout-btn"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5" id="project-container">
        <div class="loading-container">
            <div class="loading"></div>
            <p>Loading project details...</p>
        </div>
    </div>
    
    <div class="modal fade" id="applyModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-send me-2"></i>Apply to Project</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="apply-form">
                        <div class="mb-3">
                            <label for="role" class="form-label">Your Role</label>
                            <input type="text" class="form-control" id="role" placeholder="e.g., Frontend Developer, Designer" required>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Message to Project Creator</label>
                            <textarea class="form-control" id="message" rows="5" placeholder="Introduce yourself and explain why you're interested in this project"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-custom-primary" id="submit-application-btn">Submit Application</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const userId = localStorage.getItem('userId');
        const username = localStorage.getItem('username');
        const userRole = localStorage.getItem('userRole');
        
        if (!userId) {
            window.location.href = '/login.html';
        }
        
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');
        
        if (!projectId) {
            window.location.href = '/projects.html';
        }
        
        const applyModal = new bootstrap.Modal(document.getElementById('applyModal'));
        
        async function loadProjectDetails() {
            try {
                const response = await fetch(`http://localhost:5000/api/projects/${projectId}`);
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.message || 'Failed to load project details');
                }
                
                const project = data.project;
                
                document.title = `${project.title} | CollabSphere`;
                
                const isCreator = project.creator === userId;
                
                const hasApplied = project.contributors && project.contributors.some(contributor => 
                    contributor.user === userId
                );
                
                const createdDate = new Date(project.createdAt);
                const formattedDate = createdDate.toLocaleDateString('en-US', {
                    month: 'long',
                    day: 'numeric',
                    year: 'numeric'
                });
                
                let deadlineText = 'No specific deadline';
                if (project.deadline) {
                    const deadlineDate = new Date(project.deadline);
                    deadlineText = deadlineDate.toLocaleDateString('en-US', {
                        month: 'long',
                        day: 'numeric',
                        year: 'numeric'
                    });
                }
                
                let statusClass = '';
                const statusText = project.status || 'Open';
                
                switch(statusText) {
                    case 'Open':
                        statusClass = 'status-open';
                        break;
                    case 'In Progress':
                        statusClass = 'status-in-progress';
                        break;
                    case 'Completed':
                        statusClass = 'status-completed';
                        break;
                    case 'Cancelled':
                        statusClass = 'status-cancelled';
                        break;
                }
                
                const projectHTML = `
                    <!-- Replace the project header section in your HTML with this updated version -->
                    <div class="project-header">
                        <div class="d-flex justify-content-between align-items-start flex-wrap">
                            <div class="mb-4 mb-md-0">
                                <h1 class="project-title">${project.title}</h1>
                                <div class="project-meta">
                                    <span class="meta-item">
                                        <i class="bi bi-calendar3"></i>
                                        <span>Posted ${formattedDate}</span>
                                    </span>
                                    <span class="meta-item">
                                        <i class="bi bi-folder"></i>
                                        <span>${project.field}</span>
                                    </span>
                                    <span class="meta-item">
                                        <i class="bi bi-tag"></i>
                                        <span>${project.category}</span>
                                    </span>
                                    <span class="project-status ${statusClass}">${statusText}</span>
                                </div>
                            </div>
                            <div style="z-index: 2; position: relative;">
                                ${!isCreator && !hasApplied && statusText === 'Open' ? `
                                    <button class="btn btn-custom-primary" id="apply-btn">
                                        <i class="bi bi-send me-2"></i>Apply to Collaborate
                                    </button>
                                ` : ''}
                                ${!isCreator && hasApplied ? `
                                    <button class="btn btn-outline-light" disabled>
                                        <i class="bi bi-check2-circle me-2"></i>Application Submitted
                                    </button>
                                ` : ''}
                                ${isCreator ? `
                                    <button class="btn btn-outline-light me-2">
                                        <i class="bi bi-pencil me-2"></i>Edit Project
                                    </button>
                                    <button class="btn btn-custom-primary">
                                        <i class="bi bi-people me-2"></i>Manage Contributors
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                        <div class="project-creator">
                            <div class="creator-avatar">${project.creatorUsername ? project.creatorUsername.charAt(0).toUpperCase() : 'U'}</div>
                            <div class="creator-info">
                                <span class="creator-name">${project.creatorUsername || 'Anonymous'}</span>
                                <span class="creator-role">Project Creator</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-lg-8">
                            <ul class="nav nav-tabs mb-4" id="projectTabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active" id="details-tab" data-bs-toggle="tab" data-bs-target="#details" type="button" role="tab" aria-controls="details" aria-selected="true">Details</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="discussion-tab" data-bs-toggle="tab" data-bs-target="#discussion" type="button" role="tab" aria-controls="discussion" aria-selected="false">Discussion</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="contributors-tab" data-bs-toggle="tab" data-bs-target="#contributors" type="button" role="tab" aria-controls="contributors" aria-selected="false">Contributors</button>
                                </li>
                            </ul>
                            
                            <div class="tab-content" id="projectTabsContent">
                                <div class="tab-pane fade show active" id="details" role="tabpanel" aria-labelledby="details-tab">
                                    <div class="project-section">
                                        <h3 class="section-title"><i class="bi bi-info-circle"></i> Project Description</h3>
                                        <div class="section-content">
                                            <p>${project.description}</p>
                                        </div>
                                    </div>
                                    
                                    <div class="project-section">
                                        <h3 class="section-title"><i class="bi bi-code-slash"></i> Required Skills</h3>
                                        <div class="section-content">
                                            <div class="mb-4">
                                                <h5>Programming Languages</h5>
                                                <div>
                                                    ${project.languagesNeeded.map(lang => `<span class="tag">${lang}</span>`).join('')}
                                                </div>
                                            </div>
                                            ${project.technologiesNeeded && project.technologiesNeeded.length > 0 ? `
                                                <div>
                                                    <h5>Technologies & Frameworks</h5>
                                                    <div>
                                                        ${project.technologiesNeeded.map(tech => `<span class="tag">${tech}</span>`).join('')}
                                                    </div>
                                                </div>
                                            ` : ''}
                                        </div>
                                    </div>
                                    
                                    ${project.prerequisites || project.requirements ? `
                                        <div class="project-section">
                                            <h3 class="section-title"><i class="bi bi-list-check"></i> Additional Information</h3>
                                            <div class="section-content">
                                                ${project.prerequisites ? `
                                                    <div class="mb-4">
                                                        <h5>Prerequisites</h5>
                                                        <p>${project.prerequisites}</p>
                                                    </div>
                                                ` : ''}
                                                ${project.requirements ? `
                                                    <div>
                                                        <h5>Requirements</h5>
                                                        <p>${project.requirements}</p>
                                                    </div>
                                                ` : ''}
                                            </div>
                                        </div>
                                    ` : ''}
                                    
                                    ${project.goals && project.goals.length > 0 ? `
                                        <div class="project-section">
                                            <h3 class="section-title"><i class="bi bi-bullseye"></i> Project Goals</h3>
                                            <div class="section-content">
                                                <ul>
                                                    ${project.goals.map(goal => `<li>${goal}</li>`).join('')}
                                                </ul>
                                            </div>
                                        </div>
                                    ` : ''}
                                </div>
                                
                                <div class="tab-pane fade" id="discussion" role="tabpanel" aria-labelledby="discussion-tab">
                                    <div class="discussion-container">
                                        <div class="d-flex justify-content-between mb-4">
                                            <h3>Discussion Forum</h3>
                                            <button class="btn btn-custom-primary" id="new-post-btn">
                                                <i class="bi bi-plus-circle"></i> New Post
                                            </button>
                                        </div>
                                        
                                        <div id="post-form-container" class="mb-4" style="display: none;">
                                            <div class="card">
                                                <div class="card-body">
                                                    <h5 class="card-title">Create New Post</h5>
                                                    <form id="new-post-form">
                                                        <div class="mb-3">
                                                            <label for="post-title" class="form-label">Title</label>
                                                            <input type="text" class="form-control" id="post-title" required>
                                                        </div>
                                                        <div class="mb-3">
                                                            <label for="post-content" class="form-label">Content</label>
                                                            <textarea class="form-control" id="post-content" rows="4" required></textarea>
                                                        </div>
                                                        <div class="d-flex justify-content-end">
                                                            <button type="button" class="btn btn-secondary me-2" id="cancel-post-btn">Cancel</button>
                                                            <button type="submit" class="btn btn-custom-primary">Post</button>
                                                        </div>
                                                    </form>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div id="posts-container" class="posts-list"></div>
                                        
                                        <div id="posts-loading" class="text-center py-4">
                                            <div class="spinner-border text-primary" role="status">
                                                <span class="visually-hidden">Loading...</span>
                                            </div>
                                        </div>
                                        
                                        <div id="no-posts-message" class="text-center py-4" style="display: none;">
                                            <div class="no-data-icon mb-3">
                                                <i class="bi bi-chat-square-text"></i>
                                            </div>
                                            <h5>No discussions yet</h5>
                                            <p class="text-muted">Be the first to start a discussion for this project</p>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="tab-pane fade" id="contributors" role="tabpanel" aria-labelledby="contributors-tab">
                                    <div class="project-section">
                                        <h3 class="section-title"><i class="bi bi-people"></i> Project Contributors</h3>
                                        <div class="section-content">
                                            ${project.contributors && project.contributors.filter(c => c.status === 'Accepted').length > 0 ? `
                                                <div class="contributors-list">
                                                    ${project.contributors.filter(c => c.status === 'Accepted').map(contributor => `
                                                        <div class="contributor-item d-flex align-items-center mb-3">
                                                            <div class="creator-avatar me-3">${contributor.username ? contributor.username.charAt(0).toUpperCase() : 'U'}</div>
                                                            <div>
                                                                <h6 class="mb-0">${contributor.username || 'Anonymous'}</h6>
                                                                <span class="text-muted small">${contributor.role || 'Contributor'}</span>
                                                            </div>
                                                        </div>
                                                    `).join('')}
                                                </div>
                                            ` : `
                                                <div class="text-center py-4">
                                                    <div class="no-data-icon mb-3">
                                                        <i class="bi bi-people"></i>
                                                    </div>
                                                    <h5>No contributors yet</h5>
                                                    <p class="text-muted">This project is looking for contributors to join</p>
                                                </div>
                                            `}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="col-lg-4">
                            <div class="project-section">
                                <h3 class="section-title"><i class="bi bi-card-checklist"></i> Project Details</h3>
                                <div class="section-content">
                                    <div class="d-flex justify-content-between mb-3">
                                        <span>Difficulty:</span>
                                        <strong>${project.difficulty}</strong>
                                    </div>
                                    <div class="d-flex justify-content-between mb-3">
                                        <span>Duration:</span>
                                        <strong>${project.duration}</strong>
                                    </div>
                                    <div class="d-flex justify-content-between mb-3">
                                        <span>Max Contributors:</span>
                                        <strong>${project.maxContributors}</strong>
                                    </div>
                                    <div class="d-flex justify-content-between mb-3">
                                        <span>Current Contributors:</span>
                                        <strong>${project.contributors ? project.contributors.filter(c => c.status === 'Accepted').length : 0}</strong>
                                    </div>
                                    <div class="d-flex justify-content-between mb-3">
                                        <span>Deadline:</span>
                                        <strong>${deadlineText}</strong>
                                    </div>
                                </div>
                            </div>
                            
                            ${project.collaborationTools && project.collaborationTools.length > 0 ? `
                                <div class="project-section">
                                    <h3 class="section-title"><i class="bi bi-tools"></i> Collaboration Tools</h3>
                                    <div class="section-content">
                                        <div>
                                            ${project.collaborationTools.map(tool => `<span class="tag">${tool}</span>`).join('')}
                                        </div>
                                    </div>
                                </div>
                            ` : ''}
                            
                            <div class="text-center mt-4">
                                <a href="/projects.html" class="btn btn-outline-light">
                                    <i class="bi bi-arrow-left me-2"></i>Back to Projects
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                
                document.getElementById('project-container').innerHTML = projectHTML;
                
                const applyBtn = document.getElementById('apply-btn');
                if (applyBtn) {
                    applyBtn.addEventListener('click', () => {
                        applyModal.show();
                    });
                }
                
                document.getElementById('submit-application-btn').addEventListener('click', () => {
                    submitApplication(projectId);
                });
                
            } catch (error) {
                console.error('Error loading project details:', error);
                document.getElementById('project-container').innerHTML = `
                    <div class="text-center py-5">
                        <div class="mb-4">
                            <i class="bi bi-exclamation-triangle" style="font-size: 3rem; color: #dc3545;"></i>
                        </div>
                        <h3>Error Loading Project</h3>
                        <p class="text-muted mb-4">${error.message || 'Something went wrong. Please try again later.'}</p>
                        <div>
                            <a href="/projects.html" class="btn btn-outline-light me-3">
                                <i class="bi bi-arrow-left me-2"></i>Back to Projects
                            </a>
                            <button class="btn btn-custom-primary" onclick="location.reload()">
                                <i class="bi bi-arrow-clockwise me-2"></i>Try Again
                            </button>
                        </div>
                    </div>
                `;
            }
        }
        
        async function submitApplication(projectId) {
            try {
                const role = document.getElementById('role').value;
                const message = document.getElementById('message').value;
                
                if (!role) {
                    showToast('Please specify your role', 'error');
                    return;
                }
                
                const response = await fetch(`http://localhost:5000/api/projects/${projectId}/apply`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ userId, role, message })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    applyModal.hide();
                    showToast('Application submitted successfully!', 'success');
                    setTimeout(() => {
                        location.reload();
                    }, 1500);
                } else {
                    throw new Error(data.message || 'Something went wrong');
                }
            } catch (error) {
                console.error('Error submitting application:', error);
                showToast(error.message || 'Failed to submit application', 'error');
            }
        }
        
        function showToast(message, type = 'success') {
            const toastContainer = document.querySelector('.toast-container');
            
            const toast = document.createElement('div');
            toast.className = `custom-toast ${type === 'error' ? 'toast-error' : 'toast-success'}`;
            toast.innerHTML = `
                <i class="bi ${type === 'error' ? 'bi-exclamation-circle' : 'bi-check-circle'} me-2"></i>
                <span>${message}</span>
            `;
            
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => {
                    toastContainer.removeChild(toast);
                }, 500);
            }, 3000);
        }
        
        document.getElementById('logout-btn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('userId');
            localStorage.removeItem('userRole');
            localStorage.removeItem('username');
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        });
        
        document.addEventListener('DOMContentLoaded', loadProjectDetails);
    </script>
    <script src="js/discussion.js"></script>
</body>
</html>
