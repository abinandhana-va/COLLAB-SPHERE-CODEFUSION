<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | CollabSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --dark-purple: #2D1B4B;
            --medium-purple: #6A3CBF;
            --light-purple: #9D71EA;
            --accent-purple: #B288F8;
            --very-light-purple: #EDE4FF;
            --black: #121212;
            --dark-gray: #1E1E1E;
            --medium-gray: #2A2A2A;
            --light-gray: #333333;
        }
        
        body {
            background-color: var(--black);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* Navbar styling */
        .navbar {
            background: linear-gradient(135deg, var(--dark-purple) 0%, var(--medium-purple) 100%);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            padding: 15px 0;
        }
        
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 1.5rem;
        }
        
        .nav-link {
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 10px 15px !important;
            margin: 0 5px;
            border-radius: 6px;
        }
        
        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--accent-purple) !important;
            transform: translateY(-2px);
        }
        
        .page-header {
            background: linear-gradient(135deg, var(--dark-purple) 0%, var(--medium-purple) 100%);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }
        
        .page-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 80%;
            height: 200%;
            background: linear-gradient(transparent, rgba(255, 255, 255, 0.1));
            transform: rotate(35deg);
        }
        
        .page-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }
        
        .page-description {
            opacity: 0.9;
            font-size: 1.1rem;
            position: relative;
            z-index: 1;
            max-width: 700px;
        }
        
        .filter-container {
            background: var(--dark-gray);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }
        
        .filter-container:hover {
            transform: translateY(-5px);
        }
        
        .project-card {
            background: var(--medium-gray);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .card-header {
            background: linear-gradient(135deg, var(--medium-gray), var(--light-gray));
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .project-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--accent-purple);
        }
        
        .project-creator {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .card-body {
            padding: 20px;
            flex-grow: 1;
        }
        
        .project-description {
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.8);
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }
        
        .project-tag {
            display: inline-block;
            background: var(--dark-gray);
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.85rem;
            margin-right: 8px;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .project-tag:hover {
            border-color: var(--accent-purple);
            background: rgba(106, 60, 191, 0.2);
            transform: translateY(-2px);
        }
        
        .project-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            flex-wrap: wrap;
        }
        
        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .card-footer {
            background: var(--dark-gray);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .difficulty-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--medium-purple) 0%, var(--dark-purple) 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .btn-view-project {
            background: linear-gradient(135deg, var(--medium-purple) 0%, var(--dark-purple) 100%);
            border: none;
            border-radius: 6px;
            padding: 8px 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .btn-view-project:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            color: white;
        }
        
        .btn-custom-primary {
            background: linear-gradient(135deg, var(--medium-purple) 0%, var(--dark-purple) 100%);
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(106, 60, 191, 0.3);
            color: white;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-custom-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 25px rgba(106, 60, 191, 0.4);
            color: white;
        }
        
        .form-control, .form-select {
            background-color: var(--light-gray);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        
        .form-control:focus, .form-select:focus {
            background-color: var(--light-gray);
            border-color: var(--accent-purple);
            color: white;
            box-shadow: 0 0 0 0.25rem rgba(106, 60, 191, 0.25);
            transform: translateY(-2px);
        }
        
        .no-projects {
            background: var(--medium-gray);
            border-radius: 12px;
            padding: 50px 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .no-projects-icon {
            font-size: 3rem;
            color: var(--accent-purple);
            margin-bottom: 15px;
            opacity: 0.7;
        }
        
        .loading {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent-purple);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        /* Animated elements */
        .animated-icon {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }
        
        /* Toast notification */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1050;
        }
        
        .custom-toast {
            background-color: var(--dark-gray);
            color: white;
            border: 1px solid var(--accent-purple);
            border-radius: 8px;
            padding: 15px 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease forwards;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .toast-success {
            border-left: 5px solid #28a745;
        }
        
        .toast-error {
            border-left: 5px solid #dc3545;
        }
        
        /* Status indicators */
        .status-indicator {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-left: 10px;
        }
        
        .status-open {
            background-color: rgba(40, 167, 69, 0.2);
            color: #28a745;
            border: 1px solid #28a745;
        }
        
        .status-in-progress {
            background-color: rgba(0, 123, 255, 0.2);
            color: #007bff;
            border: 1px solid #007bff;
        }
        
        .status-completed {
            background-color: rgba(102, 16, 242, 0.2);
            color: #6610f2;
            border: 1px solid #6610f2;
        }
        
        .status-cancelled {
            background-color: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border: 1px solid #dc3545;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">CollabSphere</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard.html"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/profile.html"><i class="bi bi-person me-1"></i> Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/projects.html"><i class="bi bi-kanban me-1"></i> Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/discussions.html"><i class="bi bi-chat-dots me-1"></i> Discussions</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logout-btn"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="page-header">
            <div class="d-flex justify-content-between align-items-center flex-wrap">
                <div>
                    <h1 class="page-title">Explore Projects <i class="bi bi-stars ms-2 animated-icon"></i></h1>
                    <p class="page-description">Discover collaborative opportunities and connect with creative minds from around the world</p>
                </div>
                <div id="create-project-btn-container" class="mt-3 mt-md-0">
                    <!-- Will be populated by JavaScript based on user role -->
                </div>
            </div>
        </div>
        
        <!-- Filters -->
        <div class="filter-container">
            <div class="row">
                <div class="col-md-4 mb-3 mb-md-0">
                    <input type="text" class="form-control" id="search-input" placeholder="Search projects...">
                </div>
                <div class="col-md-3 mb-3 mb-md-0">
                    <select class="form-select" id="field-filter">
                        <option value="">All Fields</option>
                        <option value="Web Development">Web Development</option>
                        <option value="Mobile Development">Mobile Development</option>
                        <option value="Data Science">Data Science</option>
                        <option value="Machine Learning">Machine Learning</option>
                        <option value="Design">Design</option>
                        <option value="Content Creation">Content Creation</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="col-md-3 mb-3 mb-md-0">
                    <select class="form-select" id="difficulty-filter">
                        <option value="">All Difficulty Levels</option>
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                        <option value="Expert">Expert</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-light w-100" id="reset-filters-btn">
                        <i class="bi bi-arrow-repeat me-2"></i>Reset
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Projects Grid -->
        <div class="row" id="projects-container">
            <div class="col-12 text-center py-5">
                <div class="loading"></div>
                <p class="mt-3">Loading amazing projects...</p>
            </div>
        </div>
    </div>
    
    <!-- Toast container for notifications -->
    <div class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Get user data from localStorage
        const userId = localStorage.getItem('userId');
        const username = localStorage.getItem('username');
        const userRole = localStorage.getItem('userRole');
        
        // Redirect if not logged in
        if (!userId) {
            window.location.href = '/login.html';
        }
        
        // Show create project button only for creators
        const createProjectBtnContainer = document.getElementById('create-project-btn-container');
        if (userRole === 'creator') {
            createProjectBtnContainer.innerHTML = `
                <a href="/create-project.html" class="btn btn-custom-primary" style="z-index: 2; position: relative;">
                    <i class="bi bi-plus-lg"></i> Create Project
                </a>
            `;
        }
        
        // Load all projects
        async function loadProjects() {
            try {
                
                const response = await fetch('http://localhost:5000/api/projects');
                const data = await response.json();
                
                const projectsContainer = document.getElementById('projects-container');
                
                if (!response.ok) {
                    throw new Error(data.message || 'Failed to load projects');
                }
                
                if (data.projects.length === 0) {
                    projectsContainer.innerHTML = `
                        <div class="col-12">
                            <div class="no-projects">
                                <div class="no-projects-icon">
                                    <i class="bi bi-search"></i>
                                </div>
                                <h3>No Projects Found</h3>
                                <p class="text-muted mb-4">There are no projects available at the moment.</p>
                                ${userRole === 'creator' ? `
                                    <a href="/create-project.html" class="btn btn-custom-primary">
                                        <i class="bi bi-plus-lg me-2"></i> Create First Project
                                    </a>
                                ` : ''}
                            </div>
                        </div>
                    `;
                    return;
                }
                
                // Build the projects grid
                let projectsHTML = '';
                
                data.projects.forEach(project => {
                    // Format date
                    const createdDate = new Date(project.createdAt);
                    const formattedDate = createdDate.toLocaleDateString('en-US', {
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric'
                    });
                    
                    // Get status class
                    let statusClass = '';
                    let statusText = project.status || 'Open';
                    
                    switch(statusText) {
                        case 'Open':
                            statusClass = 'status-open';
                            break;
                        case 'In Progress':
                            statusClass = 'status-in-progress';
                            break;
                        case 'Completed':
                            statusClass = 'status-completed';
                            break;
                        case 'Cancelled':
                            statusClass = 'status-cancelled';
                            break;
                    }
                    
                    projectsHTML += `
                        <div class="col-md-6 col-lg-4 mb-4">
                            <div class="project-card">
                                <div class="card-header">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <h3 class="project-title">${project.title}
                                            <span class="status-indicator ${statusClass}">${statusText}</span>
                                        </h3>
                                    </div>
                                    <div class="project-creator">
                                        <i class="bi bi-person-circle"></i>
                                        <span>${username || 'Anonymous'}</span>
                                    </div>
                                </div>
                                <div class="card-body">
                                    <p class="project-description">${project.description}</p>
                                    <div class="mb-3">
                                        ${project.languagesNeeded.map(lang => 
                                            `<span class="project-tag">${lang}</span>`
                                        ).join('')}
                                    </div>
                                    <div class="project-meta">
                                        <div class="meta-item">
                                            <i class="bi bi-calendar3"></i>
                                            <span>${formattedDate}</span>
                                        </div>
                                        <div class="meta-item">
                                            <i class="bi bi-people"></i>
                                            <span>${project.maxContributors}</span>
                                        </div>
                                        <div class="meta-item">
                                            <i class="bi bi-clock"></i>
                                            <span>${project.duration}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-footer">
                                    <span class="difficulty-badge">${project.difficulty}</span>
                                    <a href="/project-detail.html?id=${project._id}" class="btn-view-project">
                                        View Details <i class="bi bi-arrow-right"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                projectsContainer.innerHTML = projectsHTML;
                
                // Set up filter functionality
                setupFilters(data.projects);
                
            } catch (error) {
                console.error('Error loading projects:', error);
                document.getElementById('projects-container').innerHTML = `
                    <div class="col-12">
                        <div class="no-projects">
                            <div class="no-projects-icon">
                                <i class="bi bi-exclamation-triangle"></i>
                            </div>
                            <h3>Error Loading Projects</h3>
                            <p class="text-muted mb-4">${error.message || 'Something went wrong. Please try again later.'}</p>
                            <button class="btn btn-custom-primary" onclick="location.reload()">
                                <i class="bi bi-arrow-clockwise me-2"></i> Retry
                            </button>
                        </div>
                    </div>
                `;
            }
        }
        
        // Set up project filtering
        function setupFilters(projects) {
            const searchInput = document.getElementById('search-input');
            const fieldFilter = document.getElementById('field-filter');
            const difficultyFilter = document.getElementById('difficulty-filter');
            const resetBtn = document.getElementById('reset-filters-btn');
            
            // Filter function
            function filterProjects() {
                const searchTerm = searchInput.value.toLowerCase();
                const fieldValue = fieldFilter.value;
                const difficultyValue = difficultyFilter.value;
                
                const filteredProjects = projects.filter(project => {
                    // Search term filter
                    const matchesSearch = searchTerm === '' || 
                        project.title.toLowerCase().includes(searchTerm) || 
                        project.description.toLowerCase().includes(searchTerm);
                    
                    // Field filter
                    const matchesField = fieldValue === '' || project.field === fieldValue;
                    
                    // Difficulty filter
                    const matchesDifficulty = difficultyValue === '' || project.difficulty === difficultyValue;
                    
                    return matchesSearch && matchesField && matchesDifficulty;
                });
                
                updateProjectsDisplay(filteredProjects);
            }
            
            // Update the display based on filtered projects
            function updateProjectsDisplay(filteredProjects) {
                const projectsContainer = document.getElementById('projects-container');
                
                if (filteredProjects.length === 0) {
                    projectsContainer.innerHTML = `
                        <div class="col-12">
                            <div class="no-projects">
                                <div class="no-projects-icon">
                                    <i class="bi bi-search"></i>
                                </div>
                                <h3>No Projects Found</h3>
                                <p class="text-muted mb-4">No projects match your current filters. Try adjusting your search criteria.</p>
                                <button class="btn btn-outline-light" id="clear-filters-btn">
                                    <i class="bi bi-x-circle me-2"></i>Clear Filters
                                </button>
                            </div>
                        </div>
                    `;
                    
                    document.getElementById('clear-filters-btn').addEventListener('click', () => {
                        searchInput.value = '';
                        fieldFilter.value = '';
                        difficultyFilter.value = '';
                        filterProjects();
                    });
                    
                    return;
                }
                
                let projectsHTML = '';
                
                filteredProjects.forEach(project => {
                    // Format date
                    const createdDate = new Date(project.createdAt);
                    const formattedDate = createdDate.toLocaleDateString('en-US', {
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric'
                    });
                    
                    // Get status class
                    let statusClass = '';
                    let statusText = project.status || 'Open';
                    
                    switch(statusText) {
                        case 'Open':
                            statusClass = 'status-open';
                            break;
                        case 'In Progress':
                            statusClass = 'status-in-progress';
                            break;
                        case 'Completed':
                            statusClass = 'status-completed';
                            break;
                        case 'Cancelled':
                            statusClass = 'status-cancelled';
                            break;
                    }
                    
                    projectsHTML += `
                        <div class="col-md-6 col-lg-4 mb-4">
                            <div class="project-card">
                                <div class="card-header">
                                    <div class="d-flex justify-content-between align-items-start">
                                        <h3 class="project-title">${project.title}
                                            <span class="status-indicator ${statusClass}">${statusText}</span>
                                        </h3>
                                    </div>
                                    <div class="project-creator">
                                        <i class="bi bi-person-circle"></i>
                                        <span>${username || 'Anonymous'}</span>
                                    </div>
                                </div>
                                <div class="card-body">
                                    <p class="project-description">${project.description}</p>
                                    <div class="mb-3">
                                        ${project.languagesNeeded.map(lang => 
                                            `<span class="project-tag">${lang}</span>`
                                        ).join('')}
                                    </div>
                                    <div class="project-meta">
                                        <div class="meta-item">
                                            <i class="bi bi-calendar3"></i>
                                            <span>${formattedDate}</span>
                                        </div>
                                        <div class="meta-item">
                                            <i class="bi bi-people"></i>
                                            <span>${project.maxContributors}</span>
                                        </div>
                                        <div class="meta-item">
                                            <i class="bi bi-clock"></i>
                                            <span>${project.duration}</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-footer">
                                    <span class="difficulty-badge">${project.difficulty}</span>
                                    <a href="/project-detail.html?id=${project._id}" class="btn-view-project">
                                        View Details <i class="bi bi-arrow-right"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                projectsContainer.innerHTML = projectsHTML;
            }
            
            // Add event listeners
            searchInput.addEventListener('input', filterProjects);
            fieldFilter.addEventListener('change', filterProjects);
            difficultyFilter.addEventListener('change', filterProjects);
            
            // Reset filters
            resetBtn.addEventListener('click', () => {
                searchInput.value = '';
                fieldFilter.value = '';
                difficultyFilter.value = '';
                filterProjects();
            });
        }
        
        // Show toast notification
        function showToast(message, type = 'success') {
            const toastContainer = document.querySelector('.toast-container');
            
            // Create toast element
            const toast = document.createElement('div');
            toast.className = `custom-toast ${type === 'error' ? 'toast-error' : 'toast-success'}`;
            toast.innerHTML = `
                <i class="bi ${type === 'error' ? 'bi-exclamation-circle' : 'bi-check-circle'} me-2"></i>
                <span>${message}</span>
            `;
            
            // Add to container
            toastContainer.appendChild(toast);
            
            // Remove after 3 seconds
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => {
                    toastContainer.removeChild(toast);
                }, 500);
            }, 3000);
        }
        
        // Handle logout
        document.getElementById('logout-btn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('userId');
            localStorage.removeItem('userRole');
            localStorage.removeItem('username');
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        });
        
        // Load projects on page load
        document.addEventListener('DOMContentLoaded', loadProjects);
    </script>
</body>
</html>
